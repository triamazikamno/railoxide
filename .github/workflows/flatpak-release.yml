name: Flatpak release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: flatpak-release
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:2f06ee4d6948bf5ab39b7d6cb6d4c9e73847323ae46ddb6b57313a0dee75d4ff
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve and validate release source
        id: release_source
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._+-]+$ ]]
          release_sha="$(git rev-parse HEAD)"
          [[ "$release_sha" == "$EVENT_SHA" ]]
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          [[ "$release_sha" == "$tag_sha" ]]
          wallet_version="$(python3 - <<'PY'
          import re

          in_package = False
          version = None
          with open("bins/wallet/Cargo.toml", encoding="utf-8") as manifest:
              for line in manifest:
                  stripped = line.strip()
                  if stripped == "[package]":
                      in_package = True
                      continue
                  if in_package and stripped.startswith("["):
                      break
                  if in_package and (match := re.fullmatch(r'version\s*=\s*"([^"]+)"', stripped)):
                      version = match.group(1)
                      break
          if version is None:
              raise SystemExit("wallet package version not found")
          print(version)
          PY
          )"
          [[ "$RELEASE_TAG" == "v$wallet_version" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$release_sha" origin/main
          printf 'release_sha=%s\n' "$release_sha" >>"$GITHUB_OUTPUT"

      - name: Generate Cargo sources
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-wallet-flatpak \
            --generate-sources out/flatpak/generated/cargo-sources.json \
            --generator-metadata out/flatpak/generated/generator-metadata
          cp -- bins/wallet/packaging/flatpak/rust-toolchain.yml \
            out/flatpak/generated/rust-toolchain.yml

      - name: Upload Cargo sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak-cargo-sources
          path: out/flatpak/generated
          if-no-files-found: error
    outputs:
      release_sha: ${{ steps.release_source.outputs.release_sha }}

  build:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:2f06ee4d6948bf5ab39b7d6cb6d4c9e73847323ae46ddb6b57313a0dee75d4ff
      options: --privileged
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.sources.outputs.release_sha }}
          persist-credentials: false

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download Cargo sources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flatpak-cargo-sources
          path: out/flatpak/generated

      - name: Build hardware variant
        run: >-
          scripts/build-wallet-flatpak
          --variant hardware
          --arch ${{ matrix.arch }}
          --cargo-sources out/flatpak/generated/cargo-sources.json
          --no-install-deps

      - name: Build no-hardware variant
        run: >-
          scripts/build-wallet-flatpak
          --variant no-hardware
          --arch ${{ matrix.arch }}
          --cargo-sources out/flatpak/generated/cargo-sources.json
          --no-install-deps

      - name: Upload repositories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak-repositories-${{ matrix.arch }}
          path: |
            out/flatpak/${{ matrix.arch }}/hardware/repo
            out/flatpak/${{ matrix.arch }}/no-hardware/repo
          if-no-files-found: error

  package:
    needs: [sources, build]
    runs-on: ubuntu-24.04
    environment: flatpak-release
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:2f06ee4d6948bf5ab39b7d6cb6d4c9e73847323ae46ddb6b57313a0dee75d4ff
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download Cargo sources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flatpak-cargo-sources
          path: out/flatpak/generated

      - name: Download x86_64 repositories
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flatpak-repositories-x86_64
          path: out/flatpak/repositories/x86_64

      - name: Download aarch64 repositories
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flatpak-repositories-aarch64
          path: out/flatpak/repositories/aarch64

      - name: Verify release is current and unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_SHA: ${{ needs.sources.outputs.release_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._+-]+$ ]]
          latest_release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'map(select(.draft == false and .published_at != null)) | sort_by([.published_at, .id]) | last | .id')"
          [[ "$RELEASE_ID" == "$latest_release_id" ]]
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/flatpak-release-verification"
          [[ "$(git rev-parse 'refs/tags/flatpak-release-verification^{commit}')" == "$RELEASE_SHA" ]]
          previous_file="$RUNNER_TEMP/flatpak-previous-source"
          cache_bust="release_id=$RELEASE_ID&run_id=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT"
          status="$(curl --silent --show-error --header 'Cache-Control: no-cache' --output "$previous_file" --write-out '%{http_code}' "https://triamazikamno.github.io/railoxide/flatpak/SOURCE-COMMIT?$cache_bust")"
          case "$status" in
            200)
              previous_sha="$(tr -d '\r\n' <"$previous_file")"
              [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
              git cat-file -e "${previous_sha}^{commit}" 2>/dev/null || git fetch origin "$previous_sha"
              git merge-base --is-ancestor "$previous_sha" "$RELEASE_SHA"
              ;;
            404)
              repository_status="$(curl --silent --show-error --header 'Cache-Control: no-cache' --output /dev/null --write-out '%{http_code}' "https://triamazikamno.github.io/railoxide/flatpak/repo/summary?$cache_bust")"
              [[ "$repository_status" == 404 ]]
              ;;
            *)
              printf 'could not verify the currently published source commit (HTTP %s)\n' "$status" >&2
              exit 1
              ;;
          esac

      - name: Import protected signing key
        shell: bash
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GNUPGHOME: ${{ runner.temp }}/flatpak-gnupg
        run: |
          set -euo pipefail
          [[ -n "$FLATPAK_GPG_PRIVATE_KEY" ]]
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          dbus-uuidgen --ensure=/etc/machine-id
          printf '%s' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign and package release
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          GNUPGHOME: ${{ runner.temp }}/flatpak-gnupg
          RELEASE_SHA: ${{ needs.sources.outputs.release_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          scripts/package-wallet-flatpak-release
          --tag "$RELEASE_TAG"
          --input-dir out/flatpak/repositories
          --output-dir out/flatpak/published
          --cargo-sources out/flatpak/generated/cargo-sources.json
          --generator-metadata out/flatpak/generated/generator-metadata
          --source-commit "$RELEASE_SHA"
          --gpg-key-id "$FLATPAK_GPG_KEY_ID"

      - name: Remove signing key
        if: always()
        shell: bash
        env:
          GNUPGHOME: ${{ runner.temp }}/flatpak-gnupg
        run: |
          gpgconf --homedir "$GNUPGHOME" --kill all || true
          rm -rf "$GNUPGHOME"

      - name: Revalidate release before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_SHA: ${{ needs.sources.outputs.release_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          latest_release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'map(select(.draft == false and .published_at != null)) | sort_by([.published_at, .id]) | last | .id')"
          [[ "$RELEASE_ID" == "$latest_release_id" ]]
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/flatpak-release-verification"
          [[ "$(git rev-parse 'refs/tags/flatpak-release-verification^{commit}')" == "$RELEASE_SHA" ]]

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir=out/flatpak/published/release
          assets=(
            "$release_dir/RailOxide-$RELEASE_TAG-x86_64.flatpak"
            "$release_dir/RailOxide-$RELEASE_TAG-no-hardware-x86_64.flatpak"
            "$release_dir/RailOxide-$RELEASE_TAG-aarch64.flatpak"
            "$release_dir/RailOxide-$RELEASE_TAG-no-hardware-aarch64.flatpak"
            "$release_dir/RailOxide-$RELEASE_TAG-build-provenance.tar.gz"
            "$release_dir/SHA256SUMS"
            "$release_dir/SHA256SUMS.asc"
          )
          for asset in "${assets[@]}"; do
            [[ -f "$asset" ]]
          done
          shopt -s nullglob
          release_entries=("$release_dir"/*)
          [[ ${#release_entries[@]} -eq ${#assets[@]} ]]
          existing_asset_count="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets | length')"
          [[ "$existing_asset_count" == 0 ]]
          gh release upload "$RELEASE_TAG" "${assets[@]}"
          expected_names=(
            "RailOxide-$RELEASE_TAG-aarch64.flatpak"
            "RailOxide-$RELEASE_TAG-build-provenance.tar.gz"
            "RailOxide-$RELEASE_TAG-no-hardware-aarch64.flatpak"
            "RailOxide-$RELEASE_TAG-no-hardware-x86_64.flatpak"
            "RailOxide-$RELEASE_TAG-x86_64.flatpak"
            SHA256SUMS
            SHA256SUMS.asc
          )
          mapfile -t published_names < <(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq '.assets | map(.name) | sort | .[]'
          )
          [[ ${#published_names[@]} -eq ${#expected_names[@]} ]]
          for index in "${!expected_names[@]}"; do
            [[ "${published_names[$index]}" == "${expected_names[$index]}" ]]
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out/flatpak/published/site

  deploy:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify release is still current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          latest_release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'map(select(.draft == false and .published_at != null)) | sort_by([.published_at, .id]) | last | .id')"
          [[ "$RELEASE_ID" == "$latest_release_id" ]]

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  notify:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare Telegram message
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');

            const release = context.payload.release;
            const title = release.name || release.tag_name;
            const body = release.body || 'No release notes provided.';
            const url = release.html_url;
            const prefix = [`New release: ${title}`, `Tag: ${release.tag_name}`, ''].join('\n');
            const suffix = `\n\nRelease page: ${url}`;
            const maxBodyLength = 4096 - prefix.length - suffix.length - 20;
            const trimmedBody = body.length > maxBodyLength
              ? `${body.slice(0, maxBodyLength)}\n\n...`
              : body;

            fs.writeFileSync('telegram-release-message.txt', `${prefix}${trimmedBody}${suffix}`);

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text@telegram-release-message.txt" \
            --data "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            >/dev/null
