name: Installer

on:
  pull_request:
    paths:
      - scripts/install-wallet
      - scripts/install-wallet.ps1
      - scripts/package-wallet-macos
      - scripts/*browser-extension*
      - scripts/tests/*extension*
      - extensions/**
      - flake.nix
      - flake.lock
      - docs/install-from-source.md
      - README.md
      - .github/workflows/install-wallet.yml
  push:
    branches:
      - main
    paths:
      - scripts/install-wallet
      - scripts/install-wallet.ps1
      - scripts/package-wallet-macos
      - scripts/*browser-extension*
      - scripts/tests/*extension*
      - extensions/**
      - flake.nix
      - flake.lock
      - docs/install-from-source.md
      - README.md
      - .github/workflows/install-wallet.yml

permissions:
  contents: read

jobs:
  nix-evaluation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Evaluate Nix packages for all supported systems
        run: >-
          docker run --rm --volume "$PWD:/source:ro"
          nixos/nix@sha256:4411619b45575be9fb47063c0878e2d9ef86988678b23c01bf3dd1b967d753fc
          nix --extra-experimental-features 'nix-command flakes'
          eval --no-write-lock-file --json 'path:/source#packages'
          --apply 'packages: builtins.mapAttrs (system: p: p.default.drvPath) packages'

  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check installer syntax
        run: bash -n scripts/install-wallet

      - name: Check macOS packaging syntax
        run: bash -n scripts/package-wallet-macos

      - name: Check extension packaging
        run: python3 -m unittest discover -s scripts/tests -p "test_extension_packaging.py" -v

      - name: Show installer help
        run: scripts/install-wallet --help

      - name: Dry run installer
        run: scripts/install-wallet --dry-run --no-deps --source-dir "$RUNNER_TEMP/railoxide-src" --prefix "$RUNNER_TEMP/railoxide-prefix"

      - name: Dry run main installer
        run: scripts/install-wallet --dry-run --main --no-deps --source-dir "$RUNNER_TEMP/railoxide-src" --prefix "$RUNNER_TEMP/railoxide-prefix"

      - name: Dry run ref installer
        run: scripts/install-wallet --dry-run --ref test-ref --no-deps --source-dir "$RUNNER_TEMP/railoxide-src" --prefix "$RUNNER_TEMP/railoxide-prefix"

      - name: Dry run runtime shader compatibility option
        run: scripts/install-wallet --dry-run --runtime-shaders --no-deps --source-dir "$RUNNER_TEMP/railoxide-src" --prefix "$RUNNER_TEMP/railoxide-prefix"

      - name: Check macOS packaging features for current and legacy refs
        shell: bash
        run: |
          # Load functions without invoking the installer's final main call.
          installer_functions=$(mktemp "$RUNNER_TEMP/railoxide-installer-functions.XXXXXX")
          sed '$d' scripts/install-wallet > "$installer_functions"
          source "$installer_functions"
          source_dir="$(mktemp -d "$RUNNER_TEMP/railoxide-shader-ref.XXXXXX")"
          export RAILOXIDE_FEATURE_CAPTURE="$source_dir/features"
          mkdir -p "$source_dir/scripts"
          cat > "$source_dir/scripts/package-wallet-macos" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$CARGO_FEATURES" > "$RAILOXIDE_FEATURE_CAPTURE"
          EOF
          chmod +x "$source_dir/scripts/package-wallet-macos"
          # Execute only the mock packaging handoff; suppress installation writes.
          run() {
            if [[ "$1" == env ]]; then
              "$@"
            fi
          }
          confirm() { return 0; }
          write_macos_wrapper() { :; }
          for package in gpui-pre gpui; do
            printf '[[package]]\nname = "%s"\nversion = "0.0.0"\n' "$package" > "$source_dir/Cargo.lock"
            for hardware in 1 0; do
              expected=""
              if [[ "$hardware" -eq 1 ]]; then expected=hardware; fi
              if [[ "$package" == gpui ]]; then
                expected="${expected:+$expected,}gpui/runtime_shaders"
              fi
              build_and_install_macos
              test "$(cat "$RAILOXIDE_FEATURE_CAPTURE")" = "$expected"
            done
          done

      - name: Reject build-time shaders before platform setup
        shell: bash
        run: |
          uname() {
            printf 'unexpected platform setup\n' > "$RUNNER_TEMP/railoxide-metal-platform-called"
            return 99
          }
          export -f uname
          status=0
          scripts/install-wallet --metal --dry-run > "$RUNNER_TEMP/railoxide-metal-output" 2> "$RUNNER_TEMP/railoxide-metal-error" || status=$?
          test "$status" -eq 1
          test -s "$RUNNER_TEMP/railoxide-metal-error"
          test ! -s "$RUNNER_TEMP/railoxide-metal-output"
          test ! -e "$RUNNER_TEMP/railoxide-metal-platform-called"

  windows-smoke:
    name: windows-2022
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Windows installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install-wallet.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Check Windows extension packaging
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/extension-packaging.ps1

      - name: Check extension helper integrity
        shell: pwsh
        run: python -m unittest discover -s scripts/tests -p "test_extension_packaging.py" -v

      - name: Show Windows installer help
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-wallet.ps1 -Help

      - name: Dry run Windows installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-wallet.ps1 -DryRun -NoDeps -SourceDir "$env:RUNNER_TEMP\railoxide-src" -InstallDir "$env:RUNNER_TEMP\railoxide-bin"

      - name: Dry run Windows main installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-wallet.ps1 -DryRun -Main -NoDeps -SourceDir "$env:RUNNER_TEMP\railoxide-src" -InstallDir "$env:RUNNER_TEMP\railoxide-bin"

      - name: Dry run Windows ref installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-wallet.ps1 -DryRun -Ref test-ref -NoDeps -SourceDir "$env:RUNNER_TEMP\railoxide-src" -InstallDir "$env:RUNNER_TEMP\railoxide-bin"
