[workspace]
members = [
    "bins/wallet",
    "crates/broadcaster-monitor",
    "crates/broadcaster-monitor-waku",
    "crates/broadcaster-monitor-gpui",
    "crates/railgun-ui",
    "crates/ui",
    "crates/wallet-ops",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
alloy = { version = "2", features = ["serde", "signer-mnemonic"] }
alloy-signer = { version = "2", features = ["eip712"] }
argon2 = "0.5"
base64 = "0.22"
bs58 = "0.5"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
coins-ledger = "0.13"
ed25519-dalek = "3"
eyre = "0.6"
getrandom = "0.4"
futures-util = "0.3"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
hex = "0.4"
hidapi-rusb = "1.3"
hkdf = "0.13"
hmac = "0.13"
libp2p = "0.56"
parking_lot = "0.12"
qrcodegen = "1.8"
rand = "0.10"
redb = "4.1"
protobuf = "=3.7.2"
reqwest = { version = "0.13", features = ["socks", "gzip", "deflate", "brotli", "json"] }
reqwest-websocket = "0.6"
rmp-serde = "1.3"
ruint = { version = "1.17", features = ["num-bigint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
structopt = "0.3"
thiserror = "2"
tikv-jemallocator = { version = "0.7", features = ["profiling_libunwind", "stats"] }
tikv-jemalloc-sys = { version = "0.7", features = ["profiling_libunwind", "stats"] }
tokio = "1"
trezor-client = { version = "=0.1.5", default-features = false, features = ["ethereum"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
url = "2"
async-trait = "0.1"
zeroize = { version = "1", features = ["derive"] }
arti-client = "0.43"
tor-rtcompat = "0.43"
x25519-dalek = { version = "3", features = ["static_secrets"] }

broadcaster-core = { git = "https://github.com/triamazikamno/railgun-rust", rev = "dad704dbc40165e003f92b073b27cbdc00f4d10c" }
local-db = { git = "https://github.com/triamazikamno/railgun-rust", rev = "dad704dbc40165e003f92b073b27cbdc00f4d10c" }
merkletree = { git = "https://github.com/triamazikamno/railgun-rust", rev = "dad704dbc40165e003f92b073b27cbdc00f4d10c" }
poi = { git = "https://github.com/triamazikamno/railgun-rust", rev = "dad704dbc40165e003f92b073b27cbdc00f4d10c" }
public-broadcaster-protocol = { git = "https://github.com/triamazikamno/railgun-rust", rev = "dad704dbc40165e003f92b073b27cbdc00f4d10c" }
railgun-wallet = { git = "https://github.com/triamazikamno/railgun-rust", rev = "dad704dbc40165e003f92b073b27cbdc00f4d10c" }
sync-service = { git = "https://github.com/triamazikamno/railgun-rust", rev = "dad704dbc40165e003f92b073b27cbdc00f4d10c" }
trustless-artifacts = { git = "https://github.com/triamazikamno/railgun-rust", rev = "dad704dbc40165e003f92b073b27cbdc00f4d10c" }
waku = { git = "https://github.com/triamazikamno/railgun-rust", rev = "dad704dbc40165e003f92b073b27cbdc00f4d10c" }
waku-relay = { git = "https://github.com/triamazikamno/railgun-rust", rev = "dad704dbc40165e003f92b073b27cbdc00f4d10c" }

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"
strip = true
panic = "unwind"
codegen-units = 8

[profile.dev]
opt-level = 0
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
panic = "unwind"
incremental = true

[profile.dev.build-override]
opt-level = 3
debug = 0

[profile.dev.package.rust-embed]
debug-assertions = true

[profile.dev.package.gpui-component-assets]
debug-assertions = true

[profile.dev.package."*"]
opt-level = 2
debug = false
debug-assertions = false
overflow-checks = false

[workspace.lints]
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rust.rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pub_underscore_fields = "allow"
branches_sharing_code = "warn"
clear_with_drain = "warn"
derive_partial_eq_without_eq = "warn"
empty_line_after_outer_attr = "warn"
equatable_if_let = "warn"
imprecise_flops = "warn"
iter_on_empty_collections = "warn"
iter_with_drain = "warn"
large_stack_frames = "warn"
manual_clamp = "warn"
mutex_integer = "warn"
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_undefined_repr = "warn"
trivial_regex = "warn"
tuple_array_conversions = "warn"
uninhabited_references = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
useless_let_if_seq = "warn"
use_self = "warn"
missing_const_for_fn = "warn"
empty_line_after_doc_comments = "warn"
iter_on_single_items = "warn"
match_same_arms = "warn"
doc_markdown = "warn"
unnecessary_struct_initialization = "warn"
string_lit_as_bytes = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
type_repetition_in_bounds = "warn"
flat_map_option = "warn"
manual_assert = "warn"
manual_string_new = "warn"
naive_bytecount = "warn"
needless_bitwise_bool = "warn"
zero_sized_map_values = "warn"
single_char_pattern = "warn"
needless_continue = "warn"
enum_glob_use = "warn"
iter_without_into_iter = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
too_many_arguments = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
struct_field_names = "allow"
implicit_hasher = "allow"
needless_lifetimes = "allow"
fn_params_excessive_bools = "allow"

[profile.profiling]
inherits = "release"
debug = true
panic = "abort"
strip = "none"
