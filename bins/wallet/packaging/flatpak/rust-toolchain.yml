name: rust-toolchain
buildsystem: simple
build-options:
  strip: false
  no-debuginfo: true
build-commands:
  - rust-toolchain/install.sh --prefix=/app/lib/railoxide-rust --disable-ldconfig --without=rust-docs --without=rust-docs-json-preview
  - rust-wasm-std/install.sh --prefix=/app/lib/railoxide-rust --disable-ldconfig
sources:
  - type: archive
    only-arches:
      - x86_64
    url: https://static.rust-lang.org/dist/2026-10-15/rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz
    sha256: 231fcae47ee950621374725b5fc3b5441d2fbda2955ac45dd7dc816d8876cfe7
    dest: rust-toolchain
    strip-components: 1
  - type: archive
    url: https://static.rust-lang.org/dist/2026-10-15/rust-std-1.99.1-wasm32-unknown-unknown.tar.xz
    sha256: 5f628f857dd00a8aa3fcac2e275665d2782066a5795274ed124c5b560f46423c
    dest: rust-wasm-std
    strip-components: 1
  - type: archive
    only-arches:
      - aarch64
    url: https://static.rust-lang.org/dist/2026-10-15/rust-1.99.1-aarch64-unknown-linux-gnu.tar.xz
    sha256: a48fb1e853be56ce9b8e2751f5464dbd5e16440cd81e237920f3a5e7e806333e
    dest: rust-toolchain
    strip-components: 1
cleanup:
  - /lib/railoxide-rust
