name: wasm-bindgen
buildsystem: simple
build-options:
  strip: false
  no-debuginfo: true
build-commands:
  - install -Dm0755 wasm-bindgen /app/lib/railoxide-wasm-bindgen/bin/wasm-bindgen
  - install -Dm0644 LICENSE-MIT /app/lib/railoxide-wasm-bindgen/licenses/LICENSE-MIT
  - install -Dm0644 LICENSE-APACHE /app/lib/railoxide-wasm-bindgen/licenses/LICENSE-APACHE
sources:
  - type: archive
    only-arches:
      - x86_64
    url: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz
    sha256: 61d4a7dc85acfa0d2354ccc0b8361928c7e52a746d17f28ebaa795ed3dc1614a
    strip-components: 1
  - type: archive
    only-arches:
      - aarch64
    url: https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-aarch64-unknown-linux-musl.tar.gz
    sha256: 699ddbb724ece16f912b73a98b5341a75f4b8c7886ce152d40dbe09f694e46c7
    strip-components: 1
cleanup:
  - /lib/railoxide-wasm-bindgen
